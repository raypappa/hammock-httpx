name: Publish

on:
  release:
    types: [published]
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*" # pre-release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync
        run: uv sync --all-groups

      - name: Build
        run: uv build

      - name: Check dist
        run: ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # only publish on tag / release, not on workflow_dispatch without tag
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write # for trusted publishing (PEP 740)
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/hammock-httpx/
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Build
        run: uv build

      - name: Publish to PyPI (trusted publishing)
        # uses OIDC, no token needed if PyPI project is configured for this repo
        # fallback to UV_PUBLISH_TOKEN if trusted publishing not configured:
        # set secret PYPI_TOKEN and uncomment env below
        run: uv publish --no-cache
        # env:
        #   UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

      # Alternative via pypa/gh-action-pypi-publish (uncomment if you prefer):
      # - uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     verbose: true

  # Optional: publish to TestPyPI on every push to main (uncomment)
