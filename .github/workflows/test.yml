name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: test py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies (all groups)
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      - name: Lint (ruff check)
        run: uv run ruff check src/hammock test_hammock.py

      - name: Format check (ruff format)
        run: uv run ruff format --check

      - name: Type check (ty)
        run: uv run ty check

      - name: Tests (pytest)
        run: uv run pytest -q

      - name: Build (uv build)
        run: uv build --python ${{ matrix.python-version }}

      - name: Upload artifact (py3.14 only)
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
