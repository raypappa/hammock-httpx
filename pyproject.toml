[project]
name = "hammock-httpx"
version = "0.2.4"
description = "rest like a boss — httpx edition"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Kadir Pekel", email = "kadirpekel@gmail.com" },
]
maintainers = [
    { name = "Kadir Pekel", email = "kadirpekel@gmail.com" },
]
keywords = ["rest", "api", "httpx", "http", "async"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "typing-extensions>=4.8",
]
urls = { Homepage = "https://github.com/kadirpekel/hammock" }

[project.optional-dependencies]
dev = [
    "httpretty>=1.0",
    "pytest>=7",
    "pytest-httpretty",
    "ty",
    "ruff",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hammock = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-v"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src"]
# exclude tests from default `ty check` (run `ty check src` for src-only or `ty check test_hammock.py` explicitly)
exclude = ["test_hammock.py", "tests/**"]

[dependency-groups]
dev = [
    "httpretty>=1.1.4",
    "pytest>=7",
    "ruff>=0.8",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.1.0",
    "coverage>=7.10.7",
    "ty>=0.0.79",
]

[tool.uv]
default-groups = ["dev"]
